function parseTanding(t){
 const lines=String(t||'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
 const result=[];
 const optRe=/^(A|B|C|D)[.)\-:]\s*(.+)$/i;
 const ansRe=/^(jawaban|kunci|jawaban benar)\s*[:=-]\s*(.+)$/i;
 let i=0;
 while(i<lines.length){
   let raw=lines[i];
   // Cari awal soal: nomor soal, penanda Soal/Pertanyaan, atau baris yang langsung diikuti pilihan A.
   const numbered=raw.match(/^\d+[.)]\s*(.+)$/);
   const labeled=raw.match(/^(?:soal|pertanyaan)\s*[:.-]\s*(.+)$/i);
   const nextIsOption=i+1<lines.length && optRe.test(lines[i+1]);
   if(!numbered && !labeled && !nextIsOption){i++;continue}

   const q=String((numbered&&numbered[1])||(labeled&&labeled[1])||raw).trim();
   const options=[];
   let j=i+1;
   while(j<lines.length){
     const om=lines[j].match(optRe);
     if(!om)break;
     options.push(om[2].trim());
     j++;
   }

   // Jika pilihan ditulis sebagai A-D, cari kunci setelah pilihan.
   let answer='';
   if(j<lines.length){
     const am=lines[j].match(ansRe);
     if(am){answer=am[2].trim();j++;}
   }

   // Dukung format kunci yang muncul sedikit setelah pilihan (mis. ada baris penjelasan).
   if(!answer){
     for(let k=j;k<Math.min(j+3,lines.length);k++){
       const am=lines[k].match(ansRe);
       if(am){answer=am[2].trim();j=k+1;break;}
     }
   }

   if(options.length && answer){
     const lm=answer.match(/^(?:pilihan\s*)?([ABCD])(?:[.)]\s*|\s|$)/i);
     if(lm){
       const idx='ABCD'.indexOf(lm[1].toUpperCase());
       if(idx>=0 && options[idx]!==undefined)answer=options[idx];
     }else{
       // Jika kunci berisi teks jawaban, cocokkan dengan salah satu pilihan.
       const exact=options.find(o=>o.trim().toLowerCase()===answer.trim().toLowerCase());
       if(exact)answer=exact;
     }
   }

   if(q && answer)result.push({q:q.replace(/^(?:soal|pertanyaan)\s*[:.-]\s*/i,'').trim(),a:answer,o:options});
   i=Math.max(i+1,j);
 }
 return result;
}

 if(label) label.textContent=mode==='group'?'Nama kelompok, satu nama per baris':'Nama peserta, satu nama per baris';
 if(area) area.placeholder=mode==='group'?'Kelompok 1\nKelompok 2\nKelompok 3':'Nama peserta 1\nNama peserta 2\nNama peserta 3';
 if(hint) hint.textContent=mode==='group'?'Setiap soal akan bergiliran dijawab oleh kelompok yang ditunjukkan.':'Setiap soal akan bergiliran dijawab oleh peserta yang ditunjukkan. Skor peserta diperbarui setelah setiap jawaban.';
}
function tandingStart(){
 const mode=document.querySelector('input[name="tandingMode"]:checked')?.value||'group';
 const peopleEl=document.getElementById('groups');
 const names=(peopleEl?.value||'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
 if(names.length<1){alert(mode==='group'?'Masukkan minimal 1 nama kelompok, satu nama per baris.':'Masukkan minimal 1 nama peserta, satu nama per baris.');return}
 if(mode==='group' && names.length<2){alert('Untuk mode kelompok, masukkan minimal 2 nama kelompok.');return}
 if(!currentMaterial||!currentMaterial.text){alert('Materi Tanding belum tersedia. Kembali ke pilihan materi lalu pilih materi terlebih dahulu.');return}
 const qs=parseTanding(currentMaterial.text);
 if(!qs.length){
   alert('Soal Tanding belum terbaca. Gunakan format: pertanyaan?\nA. pilihan pertama\nB. pilihan kedua\nC. pilihan ketiga\nD. pilihan keempat\nJawaban: A');
   return;
 }
 const requested=Math.max(1,Number(state.count)||8);
 const total=Math.min(requested,qs.length);
 if(total<1){alert('Jumlah soal tidak valid. Pilih minimal 1 soal.');return}
 state.tandingMode=mode;
 state.groups=names;
 // Acak urutan soal Tanding secara penuh setelah jumlah soal ditentukan.
 const selected=qs.slice(0,total);
 for(let i=selected.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[selected[i],selected[j]]=[selected[j],selected[i]]}
 state.qs=selected;
 state.i=0;
 state.scores=Object.fromEntries(names.map(n=>[n,0]));
 state.feedback=null;
 go('tandingPlay');
}
function answerTanding(opt){if(state.feedback)return;const q=state.qs[state.i],ok=String(opt).trim()===String(q.a).trim();state.feedback={ok,opt};if(ok)state.scores[state.groups[state.i%state.groups.length]]++;app()}
function answerTandingIndex(index){const q=state.qs[state.i];if(!q||!q.o||q.o[index]===undefined)return;answerTanding(q.o[index])}
function nextTanding(){state.i++;state.feedback=null;if(state.i>=state.qs.length)go('tandingEnd');else app()}
function cariStart(){
 const ws=shuffle(words(currentMaterial.text).map(x=>x.toLowerCase().replace(/[^a-zA-ZÀ-ÿ]/g,''))).filter(x=>x.length>=4);
 state.targets=[...new Set(ws)].slice(0,state.count||6);state.found=[];state.input='';state.cariMsg='';go('cariPlay')
}
function cariGuess(){const x=(document.getElementById('guess')?.value||'').trim().toLowerCase();if(!x)return;if(state.targets.includes(x)&&!state.found.includes(x)){state.found.push(x);state.cariMsg='✓ Kata ditemukan.';app()}else{state.cariMsg='✕ Kata tersebut tidak termasuk kata kunci yang tersedia.';app()}}
function submitTanding(){const v=(document.getElementById('tans')?.value||'').trim();if(!v)return;const q=state.qs[state.i];const ok=v.localeCompare(q.a,{sensitivity:'base',ignorePunctuation:true})===0;state.feedback={ok,opt:v};if(ok)state.scores[state.groups[state.i%state.groups.length]]++;app()}
const views={
login(){return `<div class="wrap"><div class="form"><div class="brand">EduArena<small>Pembelajaran Mendalam</small></div><div class="card" style="margin-top:18px"><h1>Masuk / Daftar</h1><p class="muted">Masuk dengan username untuk menyimpan materi di cloud dan mengaksesnya dari perangkat lain.</p><label>Username</label><input class="input" id="user" autocomplete="username" placeholder="Username"><label>Password</label><input class="input" id="pass" type="password" autocomplete="current-password" placeholder="Password" onkeydown="if(event.key==='Enter')login()"><div class="err" id="loginErr"></div><button class="btn" onclick="login()">Masuk / Daftar</button><p class="login-note">Username baru otomatis dibuat. Jika username sudah ada, password harus benar.</p></div></div></div>`},
home(){return `<div class="wrap"><div class="top"><div class="brand">EduArena<small>Ubah materi menjadi aktivitas belajar</small></div><div class="row"><span class="pill">👤 ${esc(data.session)}</span><button class="btn alt" onclick="logout()">Keluar</button></div></div><section class="hero"><h1>Belajar lebih bermakna.</h1><p>Belajar, Bermain, Berkembang!</p><div class="tags"><span class="tag">🧘 Berkesadaran</span><span class="tag">💡 Bermakna</span><span class="tag">🎉 Menggembirakan</span></div></section><div class="grid">${ARENAS.map(a=>`<button class="card arena" onclick="selectArena('${a.id}')" style="border-top:5px solid ${a.color}"><span class="ico">${a.icon}</span><h3>${a.name}</h3><span class="muted">${a.desc}</span></button>`).join('')}</div><section class="section"><div class="row between"><h2>📚 Materi Saya</h2><span class="badge">${materials().length} materi</span></div><div class="card"><input class="input" id="mtitle" placeholder="Judul materi"><textarea class="area" id="mtext" rows="6" placeholder="Tempel isi materi di sini..."></textarea><button class="btn" onclick="addMaterial()">+ Simpan Materi</button></div><div class="list">${materials().map(m=>`<div class="card material"><div><b>${esc(m.title)}</b><div class="muted">${esc(m.text.slice(0,150))}${m.text.length>150?'…':''}</div></div><button class="btn alt" onclick="removeMaterial('${m.id}')">Hapus</button></div>`).join('')||'<div class="card muted">Belum ada materi.</div>'}</div></section></div>`},
material(){const a=ARENAS.find(x=>x.id===currentArena);return `<div class="wrap"><div class="top"><button class="btn alt" onclick="go('home')">← Beranda</button><div class="brand">${a.icon} ${a.name}<small>Pilih materi</small></div></div><div class="list">${materials().map(m=>`<div class="card material"><div><b>${esc(m.title)}</b><div class="muted">${esc(m.text.slice(0,180))}${m.text.length>180?'…':''}</div></div><button class="btn" onclick="selectMaterial('${m.id}')">Pilih →</button></div>`).join('')}</div></div>`},
radar(){return `<div class="wrap"><div class="top"><button class="btn alt" onclick="go('material')">← Materi</button><div class="brand">📡 Radar Arena</div></div><div class="card"><h2>${esc(currentMaterial.title)}</h2><label>Jumlah pertanyaan: <b id="cv">6</b></label><input type="range" min="1" max="12" value="6" oninput="state.count=+this.value;document.getElementById('cv').textContent=this.value"><label>Nama siswa, satu nama per baris</label><textarea class="area" id="names" rows="7" placeholder="Masukkan nama siswa..."></textarea><button class="btn" onclick="radarStart()">Mulai Radar</button></div></div>`},
radarPlay(){return `<div class="wrap"><div class="top"><button class="btn alt" onclick="go('radar')">← Pengaturan</button><div class="brand">📡 Radar Arena</div></div><div class="card" style="text-align:center"><span class="badge">Pemilihan Siswa</span><div style="margin:22px auto 16px;max-width:520px;border:3px solid #0794a8;border-radius:24px;padding:30px 18px;background:linear-gradient(145deg,#effcff,#fff);box-shadow:0 12px 28px rgba(7,148,168,.12)"><div class="muted" style="font-size:13px">${state.spinning?'Memilih secara acak...':'Siswa terpilih'}</div><div style="font-size:clamp(30px,7vw,52px);font-weight:900;color:#0794a8;margin-top:6px;min-height:68px;display:flex;align-items:center;justify-content:center">${esc(state.rollingName||state.selectedName||'Siap?')}</div></div><button class="btn" ${state.spinning?'disabled':''} onclick="radarPick()">${state.spinning?'⟳ Memutar...':'🎯 Putar Nama'}</button>${state.selectedName?`<div class="feedback ok" style="max-width:520px;margin:18px auto 0">✓ ${esc(state.selectedName)} terpilih untuk menjawab.</div>`:''}</div><div class="card"><span class="badge">Pertanyaan ${state.i+1}/${state.q.length}</span><h2 style="margin-top:14px">${esc(state.q[state.i])}</h2><p class="muted">Siswa terpilih dapat menanggapi secara lisan atau tertulis.</p><div class="row between"><button class="btn alt" onclick="radarNext(-1)">← Sebelumnya</button><button class="btn" onclick="radarNext(1)">Berikutnya →</button></div></div><div class="card"><b>Daftar siswa</b><p class="muted">${state.names.length?state.names.map(n=>`<span class="pill" style="display:inline-block;margin:3px">${esc(n)}</span>`).join(' '):'Belum ada daftar nama.'}</p></div></div>`},
rakit(){return `<div class="wrap"><div class="top"><button class="btn alt" onclick="go('material')">← Materi</button><div class="brand">🧩 Rakit Kalimat</div></div><div class="card"><h2>Susun kalimat dari materi</h2><label>Jumlah soal: <b id="rv">5</b></label><input type="range" min="1" max="12" value="5" oninput="state.count=+this.value;document.getElementById('rv').textContent=this.value"><button class="btn" onclick="rakitStart()">Mulai</button></div></div>`},
rakitPlay(){return `<div class="wrap"><div class="top"><button class="btn alt" onclick="go('rakit')">← Pengaturan</button><div class="brand">🧩 Rakit Kalimat</div></div><div class="card"><span class="badge">Soal ${state.i+1}/${state.sentences.length}</span><div class="answer">${state.answer.length?state.answer.map((x,i)=>`<button class="word" onclick="undoWord(${i})">${esc(x.w)}</button>`).join(' '):'<span class="muted">Susunan jawaban muncul di sini.</span>'}</div><div>${state.pool.map((x,i)=>`<button class="word ${x.used?'used':''}" onclick="addWord(${i})">${esc(x.w)}</button>`).join(' ')}</div>${state.feedback==='correct'?'<div class="feedback ok">✓ Benar. Susunan kalimat sudah sesuai.</div>':state.feedback==='wrong'?'<div class="feedback bad">✕ Belum tepat. Coba susun kembali.</div>':''}<div class="row" style="margin-top:14px"><button class="btn" onclick="checkRakit()">Periksa</button><button class="btn alt" onclick="newPuzzle()">Acak ulang</button><button class="btn alt" onclick="nextRakit()">Soal berikutnya →</button></div></div></div>`},
tanding(){const available=Math.max(1,parseTanding(currentMaterial?.text||'').length);const defaultCount=Math.min(5,available);return `<div class="wrap"><div class="top"><button class="btn alt" onclick="go('material')">← Materi</button><div class="brand">⚔️ Tanding</div></div><div class="card"><h2>Pilih mode Tanding</h2><p class="muted">Tentukan siapa yang akan mendapat giliran menjawab. Skor mode individu ditampilkan selama permainan dan pada hasil akhir. Skor mode kelompok ditampilkan setelah semua soal selesai.</p><div class="row" style="margin:14px 0;gap:10px"><label class="pill" style="cursor:pointer"><input type="radio" name="tandingMode" value="individual" onchange="tandingModeChange()"> 👤 Individu</label><label class="pill" style="cursor:pointer"><input type="radio" name="tandingMode" value="group" checked onchange="tandingModeChange()"> 👥 Kelompok</label></div><label>Jumlah soal: <b id="tv">${defaultCount}</b> <span class="muted">(tersedia ${available})</span></label><input type="range" min="1" max="${available}" value="${defaultCount}" oninput="state.count=+this.value;document.getElementById('tv').textContent=this.value"><label id="tandingPeopleLabel">Nama kelompok, satu nama per baris</label><textarea class="area" id="groups" rows="5" placeholder="Kelompok 1\nKelompok 2\nKelompok 3"></textarea><p class="muted" id="tandingPeopleHint">Setiap soal akan bergiliran dijawab oleh kelompok yang ditunjukkan.</p><button class="btn" onclick="tandingStart()">Mulai Tanding</button></div></div>`},
tandingPlay(){
 const q=state.qs[state.i],g=state.groups[state.i%state.groups.length];
 const choices=q.o.length>1?q.o:'';
 const who=state.tandingMode==='group'?`Kelompok ${esc(g)}`:`Peserta ${esc(g)}`;
 return `<div class="wrap"><div class="top"><div class="brand">⚔️ Tanding</div><span class="pill">Soal ${state.i+1}/${state.qs.length}</span></div><div class="card" style="text-align:center"><span class="badge">🎯 Giliran Menjawab</span><h1 style="margin:12px 0 4px">${who}</h1><p class="muted">${state.tandingMode==='group'?'Kelompok ini yang menjawab soal berikut.':'Peserta ini yang menjawab soal berikut.'}</p>${state.tandingMode==='individual'?`<div class="pill" style="margin-top:8px">Skor peserta: <b>${state.scores[g]||0}</b></div>`:''}</div><div class="card"><span class="badge">Pertanyaan ${state.i+1}</span><h2>${esc(q.q)}</h2><p class="muted">Pilih jawaban yang paling tepat berdasarkan materi.</p>${choices?choices.map((o,oi)=>`<button class="option ${state.feedback?(o===q.a?'correct':o===state.feedback.opt?'wrong':''):''}" ${state.feedback?'disabled':''} onclick="answerTandingIndex(${oi})">${String.fromCharCode(65+oi)}. ${esc(o)}</button>`).join(''):`<input class="input" id="tans" ${state.feedback?'disabled':''} placeholder="Ketik jawaban" value="${state.feedback?esc(state.feedback.opt):''}" onkeydown="if(event.key==='Enter')submitTanding()">${!state.feedback?'<button class="btn" onclick="submitTanding()">Periksa Jawaban</button>':''}`}${state.feedback?`<div class="feedback ${state.feedback.ok?'ok':'bad'}">${state.feedback.ok?'✓ Jawaban benar.':'✕ Jawaban belum tepat.'}<div style="font-weight:600;margin-top:5px">Jawaban acuan: ${esc(q.a)}</div></div><button class="btn" style="margin-top:12px" onclick="nextTanding()">${state.i+1===state.qs.length?'Lihat hasil':'Lanjut ke giliran berikutnya →'}</button>`:''}</div></div>`
 },
tandingEnd(){
 const entries=Object.entries(state.scores).sort((a,b)=>b[1]-a[1]);
 const title=state.tandingMode==='group'?'Hasil Akhir Kelompok':'Hasil Akhir Individu';
 const subtitle=state.tandingMode==='group'?'Rekap skor setiap kelompok setelah seluruh soal selesai.':'Rekap skor setiap peserta setelah seluruh soal selesai.';
 const rows=entries.map((x,i)=>`<div class="row" style="justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--bd)"><div style="display:flex;align-items:center;gap:10px"><span class="badge" style="min-width:34px;text-align:center">${i+1}</span><b>${esc(x[0])}</b></div><strong>${x[1]} poin</strong></div>`).join('');
 return `<div class="wrap"><div class="top"><button class="btn alt" onclick="go('home')">← Beranda</button><div class="brand">🏁 Tanding Selesai</div></div><div class="card" style="text-align:center"><h2>${title}</h2><p class="muted">${subtitle}</p></div><div class="card"><h3 style="margin-top:0">📊 Peringkat</h3>${rows||'<p class="muted">Belum ada hasil.</p>'}</div><div class="row" style="margin-top:14px"><button class="btn" onclick="go('tanding')">Main Lagi</button><button class="btn alt" onclick="go('home')">Kembali ke Beranda</button></div></div>`},
};
app();
bootCloud();
</script></body></html>
